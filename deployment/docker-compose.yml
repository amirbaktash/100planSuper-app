version: "3.9"
# DARIC Super App — استقرار کامل ۱۳ سرویس + داشبورد
services:
  gateway:         { build: ./gateway, ports: ["443:443"], depends_on: [redis, postgres] }
  user-service:    { build: ./services/user-service,     env_file: .env.prod, deploy: { replicas: 2 } }
  mlm-service:     { build: ./services/mlm-service,      env_file: .env.prod }
  game-service:    { build: ./services/game-service,     env_file: .env.prod }
  loan-service:    { build: ./services/loan-service,     env_file: .env.prod }
  accounting:      { build: ./services/accounting-service, env_file: .env.prod }
  nav-service:     { build: ./services/nav-service,      env_file: .env.prod }
  exchange:        { build: ./services/exchange-service, env_file: .env.prod }
  gold-silver:     { build: ./services/gold-silver-fund, env_file: .env.prod }
  tourism:         { build: ./services/tourism-service,  env_file: .env.prod }
  insurance:       { build: ./services/insurance-service, env_file: .env.prod }
  admin:           { build: ./services/admin-service,    env_file: .env.prod }
  oracle:          { build: ./services/oracle-service,   env_file: .env.prod }
  wallet:          { build: ./services/wallet-service,   env_file: .env.prod }
  dashboard:       { build: ./dashboard }
  postgres:        { image: postgres:16, volumes: [pgdata:/var/lib/postgresql/data], environment: { POSTGRES_PASSWORD: ${POSTGRES_PASS:?required} } }
  redis:           { image: redis:7-alpine, command: "redis-server --requirepass ${REDIS_PASS:?required}" }
volumes: { pgdata: {} }
